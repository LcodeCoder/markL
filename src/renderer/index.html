<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: file:; font-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self';" />
  <title>MarkL</title>
  <link rel="stylesheet" href="../../node_modules/vditor/dist/index.css" />
  <link rel="stylesheet" href="../../node_modules/vditor/dist/js/highlight.js/styles/github.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="theme-light">
  <div id="app-shell">
    <aside id="sidebar" aria-label="文档目录">
      <div class="brand-panel">
        <img src="../../assets/logo-wordmark.png" alt="MarkL" class="brand-logo" />
      </div>

      <div class="sidebar-tabs" role="tablist" aria-label="侧栏视图">
        <button id="tab-files" class="sidebar-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="files-panel" title="工作区文件目录">
          目录
        </button>
        <button id="tab-outline" class="sidebar-tab" type="button" role="tab" aria-selected="false" aria-controls="outline-panel" title="当前文档的标题结构">
          结构
        </button>
      </div>

      <div id="files-panel" class="sidebar-panel" role="tabpanel" aria-labelledby="tab-files">
        <div class="sidebar-actions" id="sidebar-actions">
          <button id="open-folder-button" class="primary-button" type="button" title="选择一个包含 Markdown 文档的文件夹">
            打开文件夹
          </button>
          <button id="new-tree-button" class="icon-button hidden" type="button" title="新建文档" aria-label="新建文档">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 2.75a.75.75 0 0 1 .75.75v3.75H12.5a.75.75 0 0 1 0 1.5H8.75V12.5a.75.75 0 0 1-1.5 0V8.75H3.5a.75.75 0 0 1 0-1.5h3.75V3.5A.75.75 0 0 1 8 2.75Z"/></svg>
          </button>
          <button id="refresh-tree-button" class="icon-button hidden" type="button" title="刷新目录" aria-label="刷新目录">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M3.2 8a4.8 4.8 0 0 1 8.14-3.4l.76-.76A.7.7 0 0 1 13.3 4.3v2.5a.6.6 0 0 1-.6.6H10.2a.7.7 0 0 1-.5-1.2l.7-.7A3.4 3.4 0 1 0 11.4 9.7a.7.7 0 1 1 1.24.64A4.8 4.8 0 0 1 3.2 8Z"/></svg>
          </button>
        </div>

        <div id="workspace-heading" class="workspace-heading hidden">
          <span id="workspace-name"></span>
        </div>

        <nav id="file-tree" class="file-tree" aria-label="文件列表">
          <div id="tree-empty" class="tree-empty">
            <p>还没有打开文件夹</p>
            <span>打开后，左侧会列出文档。在空白处右键即可新建页面。</span>
          </div>
        </nav>

        <section id="open-history" class="open-history is-collapsed" aria-label="打开历史">
          <div class="history-heading">
            <button id="history-toggle" class="history-toggle" type="button" aria-expanded="false" aria-controls="history-list">
              打开历史
            </button>
            <button id="clear-history-button" class="history-clear hidden" type="button" title="清空打开历史">清空</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>
      </div>

      <div id="outline-panel" class="sidebar-panel hidden" role="tabpanel" aria-labelledby="tab-outline">
        <nav id="heading-tree" class="heading-tree" aria-label="文档标题结构"></nav>
      </div>

      <div class="sidebar-footer">
        <span id="workspace-path">.md · .markdown · .txt</span>
      </div>
    </aside>

    <div id="sidebar-backdrop" aria-hidden="true"></div>

    <main id="main-content">
      <header id="document-header">
        <div class="document-identity">
          <button id="sidebar-toggle" class="icon-button" type="button" title="显示或隐藏目录栏" aria-label="显示或隐藏目录栏">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M2.5 4.25h11a.75.75 0 0 1 0 1.5h-11a.75.75 0 0 1 0-1.5Zm0 3h11a.75.75 0 0 1 0 1.5h-11a.75.75 0 0 1 0-1.5Zm0 3h11a.75.75 0 0 1 0 1.5h-11a.75.75 0 0 1 0-1.5Z"/></svg>
          </button>
          <div class="document-name-group">
            <div class="document-title-row">
              <span id="doc-title">未命名.md</span>
              <span id="dirty-dot" class="hidden" title="有未保存的更改">●</span>
            </div>
            <span id="doc-path">新文档</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="new-button" class="text-button" type="button" title="新建文档（Ctrl+N）">新建</button>
          <button id="open-button" class="text-button" type="button" title="打开文件（Ctrl+O）">打开</button>
          <button id="save-button" class="accent-button" type="button" title="保存（Ctrl+S）">保存</button>
          <button id="check-update-button" class="text-button update-button" type="button" title="检查是否有新版本">检查更新</button>
        </div>
      </header>

      <section id="editor-wrap" aria-label="Markdown 编辑器">
        <div id="editor"></div>
        <textarea id="source-editor" class="hidden" spellcheck="false" aria-label="Markdown 源码"></textarea>
        <div id="table-toolbar" class="table-toolbar hidden" role="toolbar" aria-label="表格工具">
          <div class="table-toolbar-group">
            <button id="table-insert-button" type="button" data-table-action="toggle-insert" title="选择表格大小" aria-label="选择表格大小" aria-haspopup="dialog" aria-expanded="false">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M3.25 2A1.25 1.25 0 0 0 2 3.25v9.5A1.25 1.25 0 0 0 3.25 14h9.5A1.25 1.25 0 0 0 14 12.75v-9.5A1.25 1.25 0 0 0 12.75 2h-9.5ZM3.5 6.5h3v3h-3v-3Zm4.5 0h4.5v3H8v-3Zm-4.5 4.5h3v2.5H3.75a.25.25 0 0 1-.25-.25V11Zm4.5 0h4.5v2.25a.25.25 0 0 1-.25.25H8V11ZM6.5 3.5v1.5h-3V3.75c0-.138.112-.25.25-.25H6.5Zm1.5 0h4.25c.138 0 .25.112.25.25V5H8V3.5Z"/></svg>
            </button>
            <button type="button" data-table-action="align-left" title="当前列居左" aria-label="当前列居左">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M2.25 3.15h11.5v1.2H2.25zm0 4.25h8.2v1.2h-8.2zm0 4.25h11.5v1.2H2.25z"/></svg>
            </button>
            <button type="button" data-table-action="align-center" title="当前列居中" aria-label="当前列居中">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M2.25 3.15h11.5v1.2H2.25zm2.15 4.25h7.2v1.2h-7.2zM2.25 11.65h11.5v1.2H2.25z"/></svg>
            </button>
            <button type="button" data-table-action="align-right" title="当前列居右" aria-label="当前列居右">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M2.25 3.15h11.5v1.2H2.25zm3.3 4.25h8.2v1.2h-8.2zM2.25 11.65h11.5v1.2H2.25z"/></svg>
            </button>
          </div>
          <div class="table-toolbar-group">
            <button id="table-more-button" type="button" data-table-action="toggle-more" title="更多" aria-label="更多" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 3.15a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1Zm0 3.85a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1Zm0 3.85a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1Z"/></svg>
            </button>
            <button type="button" class="is-danger" data-table-action="delete-table" title="删除表格" aria-label="删除表格">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M6.15 2.35h3.7c.22 0 .42.15.48.36l.17.59H13a.7.7 0 0 1 0 1.4h-.4l-.58 6.72A1.7 1.7 0 0 1 10.33 13.3H5.67a1.7 1.7 0 0 1-1.69-1.88L3.4 4.7H3a.7.7 0 0 1 0-1.4h2.5l.17-.59a.5.5 0 0 1 .48-.36Zm.46 1.4-.08.25h2.94l-.08-.25H6.61ZM4.81 4.7l.56 6.54c.04.4.37.66.7.66h4.66c.33 0 .66-.26.7-.66L11.2 4.7H4.81Z"/></svg>
            </button>
          </div>
          <div id="table-insert-menu" class="table-menu table-size-picker hidden" role="dialog" aria-label="选择表格大小">
            <div id="table-size-grid" class="table-size-grid" role="grid" aria-label="表格行列"></div>
            <div class="table-size-label"><span id="table-size-text">1 x 1</span></div>
          </div>
          <div id="table-more-menu" class="table-menu table-menu-right hidden" role="menu" aria-label="更多表格操作">
            <button type="button" role="menuitem" data-table-action="delete-row">删除当前行</button>
            <button type="button" role="menuitem" data-table-action="delete-column">删除当前列</button>
          </div>
        </div>
        <div id="language-popup" class="language-popup hidden" role="listbox" aria-label="选择代码语言">
          <div class="language-popup-header">
            <span>代码语言</span>
            <kbd>Enter</kbd>
          </div>
          <input id="language-query-input" class="language-query-input" type="text" placeholder="输入语言，例如 java" autocomplete="off" />
          <div id="language-list" class="language-list"></div>
        </div>
        <div id="find-bar" class="find-bar hidden" role="search" aria-label="查找和替换">
          <div class="find-row">
            <input id="find-input" class="find-input" type="text" placeholder="查找" autocomplete="off" spellcheck="false" />
            <span id="find-count" class="find-count" aria-live="polite"></span>
            <button id="find-case" type="button" title="区分大小写" aria-label="区分大小写" aria-pressed="false">Aa</button>
            <button id="find-prev" type="button" title="上一个（Shift+Enter）" aria-label="上一个">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 3.2 3.4 7.8a.7.7 0 1 0 1 1L7.3 5.9V12.5a.7.7 0 1 0 1.4 0V5.9l2.9 2.9a.7.7 0 1 0 1-1z"/></svg>
            </button>
            <button id="find-next" type="button" title="下一个（Enter）" aria-label="下一个">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 12.8 3.4 8.2a.7.7 0 1 1 1-1l2.9 2.9V3.5a.7.7 0 1 1 1.4 0v6.6l2.9-2.9a.7.7 0 1 1 1 1z"/></svg>
            </button>
            <button id="find-toggle-replace" type="button" title="显示替换" aria-label="显示替换" aria-expanded="false">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M3.2 5.2 8 10l4.8-4.8-.9-.9L8 8.2 4.1 4.3z"/></svg>
            </button>
            <button id="find-close" type="button" title="关闭（Esc）" aria-label="关闭查找">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="m4.2 3.2 3.8 3.8 3.8-3.8.9.9L8.9 8l3.8 3.8-.9.9L8 8.9l-3.8 3.8-.9-.9L7.1 8 3.3 4.2z"/></svg>
            </button>
          </div>
          <div id="replace-row" class="find-row replace-row hidden">
            <input id="replace-input" class="find-input" type="text" placeholder="替换为" autocomplete="off" spellcheck="false" />
            <button id="replace-one" class="find-text-button" type="button" title="替换当前（Ctrl+Alt+Enter）">替换</button>
            <button id="replace-all" class="find-text-button" type="button" title="全部替换">全部替换</button>
          </div>
        </div>
        <div id="update-panel" class="update-panel hidden" role="dialog" aria-labelledby="update-title" aria-describedby="update-lead">
          <div class="update-head">
            <img src="../../assets/logo-mark.png" alt="" width="18" height="18" />
            <h2 id="update-title">检查更新</h2>
            <button id="update-close" class="update-icon-btn" type="button" title="关闭" aria-label="关闭">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="m4.2 3.2 3.8 3.8 3.8-3.8.9.9L8.9 8l3.8 3.8-.9.9L8 8.9l-3.8 3.8-.9-.9L7.1 8 3.3 4.2z"/></svg>
            </button>
          </div>
          <div class="update-body">
            <p id="update-lead" class="update-lead" aria-live="polite">正在查看新版本</p>
            <p id="update-versions" class="update-versions hidden">
              <span id="update-current"></span>
              <span class="update-arrow" aria-hidden="true">→</span>
              <span id="update-latest"></span>
            </p>
            <p id="update-meta" class="update-meta hidden"></p>
            <ul id="update-notes" class="update-notes hidden"></ul>
            <p id="update-error" class="update-error hidden"></p>
          </div>
          <div id="update-actions" class="update-actions">
            <button id="update-download" class="update-download hidden" type="button">下载绿色版</button>
            <button id="update-setup" class="text-button hidden" type="button">下载安装版</button>
            <button id="update-retry" class="text-button hidden" type="button">再试一次</button>
            <button id="update-later" class="text-button hidden" type="button">稍后</button>
            <button id="update-ok" class="text-button hidden" type="button">确定</button>
            <button id="update-release" class="update-link hidden" type="button">GitHub Release</button>
          </div>
        </div>
        <div id="quick-open" class="quick-open hidden" role="dialog" aria-label="快速打开">
          <input id="quick-open-input" class="quick-open-input" type="text" placeholder="打开工作区里的文档" autocomplete="off" spellcheck="false" />
          <div id="quick-open-list" class="quick-open-list" role="listbox" aria-label="匹配的文档"></div>
        </div>
        <div id="drop-mask" class="drop-mask" aria-hidden="true">将图片放到文档中</div>
      </section>

      <footer id="statusbar">
        <div class="status-group">
          <button id="status-sidebar-toggle" type="button" title="显示或隐藏目录栏">目录</button>
          <span id="save-status">已保存</span>
        </div>
        <div class="status-group status-right">
          <button id="mode-label" type="button" title="切换即时渲染与 Markdown 源码">即时渲染</button>
          <span id="encoding-label">UTF-8</span>
          <span id="counts">0 字 · 0 字符</span>
        </div>
      </footer>
    </main>
  </div>

  <div id="app-dialog" class="app-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="app-dialog-title">
    <div class="app-dialog-backdrop" id="app-dialog-backdrop"></div>
    <div class="app-dialog-card">
      <h2 id="app-dialog-title">提示</h2>
      <p id="app-dialog-body" class="app-dialog-body"></p>
      <div class="app-dialog-actions">
        <button type="button" id="app-dialog-cancel" class="text-button">取消</button>
        <button type="button" id="app-dialog-ok" class="app-dialog-ok">确定</button>
      </div>
    </div>
  </div>

  <script src="../../node_modules/vditor/dist/js/highlight.js/highlight.min.js"></script>
  <script src="../../node_modules/vditor/dist/js/highlight.js/third-languages.js"></script>
  <script src="../../node_modules/vditor/dist/index.min.js"></script>
  <script type="module" src="./renderer.js"></script>
</body>
</html>
