<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: file:; font-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self';" />
  <title>MarkL</title>
  <link rel="stylesheet" href="../../node_modules/vditor/dist/index.css" />
  <link rel="stylesheet" href="../../node_modules/vditor/dist/js/highlight.js/styles/github.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="theme-light">
  <div id="app-shell">
    <aside id="sidebar" aria-label="文档目录">
      <nav class="sidebar-rail" role="tablist" aria-label="侧栏视图">
        <button id="tab-files" class="rail-button is-active" type="button" role="tab" aria-selected="true" aria-controls="files-panel" title="目录" aria-label="目录">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round" d="M2.65 5.5V4.32c0-.4.33-.72.74-.72h1.88c.23 0 .45.1.6.28L7.05 5.5h5.5c.48 0 .87.39.87.87v6.05c0 .55-.44 1-.98 1H3.56c-.54 0-.98-.45-.98-1V5.5h10.84"/></svg>
        </button>
        <button id="tab-outline" class="rail-button" type="button" role="tab" aria-selected="false" aria-controls="outline-panel" title="结构" aria-label="结构">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" d="M3.2 4.25h9.6M3.2 8h9.6M3.2 11.75h6.4"/></svg>
        </button>
        <button id="tab-search" class="rail-button" type="button" role="tab" aria-selected="false" aria-controls="search-panel" title="搜索工作区" aria-label="搜索工作区">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.35"/><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" d="m10.2 10.2 3.15 3.15"/></svg>
        </button>
      </nav>

      <div class="sidebar-body">
      <div class="brand-panel">
        <img src="../../assets/logo-wordmark.png" alt="MarkL" class="brand-logo" />
      </div>

      <div id="files-panel" class="sidebar-panel" role="tabpanel" aria-labelledby="tab-files">
        <div class="sidebar-actions" id="sidebar-actions">
          <button id="open-folder-button" class="primary-button" type="button" title="选择一个包含 Markdown 文档的文件夹">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path class="folder-line" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round" d="M2.65 5.5V4.32c0-.4.33-.72.74-.72h1.88c.23 0 .45.1.6.28L7.05 5.5h5.5c.48 0 .87.39.87.87v6.05c0 .55-.44 1-.98 1H3.56c-.54 0-.98-.45-.98-1V5.5h10.84"/></svg>
            打开文件夹
          </button>
          <button id="new-tree-button" class="icon-button hidden" type="button" title="新建文档" aria-label="新建文档">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" d="M8 3.35v9.3M3.35 8h9.3"/></svg>
          </button>
          <button id="refresh-tree-button" class="icon-button hidden" type="button" title="刷新目录" aria-label="刷新目录">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" d="M3.3 8a4.7 4.7 0 0 1 7.95-3.35l.75-.75M12.75 2.7v2.85h-2.85M12.7 8a4.7 4.7 0 0 1-7.95 3.35l-.75.75M3.25 13.3V10.45h2.85"/></svg>
          </button>
        </div>

        <div id="workspace-heading" class="workspace-heading hidden">
          <span id="workspace-name"></span>
        </div>

        <nav id="file-tree" class="file-tree" aria-label="文件列表">
          <div id="tree-empty" class="tree-empty">
            <p>还没有打开文件夹</p>
            <span>打开后，左侧会列出文档。在空白处右键即可新建页面。</span>
          </div>
        </nav>

        <section id="open-history" class="open-history is-collapsed" aria-label="打开历史">
          <div class="history-heading">
            <button id="history-toggle" class="history-toggle" type="button" aria-expanded="false" aria-controls="history-list">
              打开历史
            </button>
          <button id="clear-history-button" class="history-clear hidden" type="button" title="清空打开历史">
            <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" d="M4.4 4.4 11.6 11.6M11.6 4.4 4.4 11.6"/></svg>
            清空
          </button>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>
      </div>

      <div id="outline-panel" class="sidebar-panel hidden" role="tabpanel" aria-labelledby="tab-outline">
        <div id="outline-heading" class="outline-heading">
          <span id="outline-doc-name">未命名.md</span>
          <span id="outline-count" class="outline-count"></span>
        </div>
        <nav id="heading-tree" class="heading-tree" aria-label="文档标题结构"></nav>
      </div>

      <div id="search-panel" class="sidebar-panel hidden" role="tabpanel" aria-labelledby="tab-search">
        <div class="workspace-search-bar">
          <input id="workspace-search-input" class="workspace-search-input" type="text" placeholder="搜索文件名或正文" autocomplete="off" spellcheck="false" />
        </div>
        <div id="workspace-search-results" class="workspace-search-results" aria-label="搜索结果"></div>
      </div>

      <div class="sidebar-footer">
        <span id="workspace-path">.md · .markdown · .txt</span>
      </div>
      </div>
    </aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="调整目录栏宽度" tabindex="0"></div>

    <div id="sidebar-backdrop" aria-hidden="true"></div>

    <main id="main-content">
      <header id="document-header">
        <div class="document-identity">
          <button id="sidebar-toggle" class="icon-button" type="button" title="显示或隐藏目录栏" aria-label="显示或隐藏目录栏">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" d="M2.8 4.25h10.4M2.8 8h10.4M2.8 11.75h10.4"/></svg>
          </button>
          <div class="document-name-group">
            <div class="document-title-row">
              <span id="doc-title">未命名.md</span>
              <span id="dirty-dot" class="hidden" title="有未保存的更改">●</span>
            </div>
            <span id="doc-path">新文档</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="new-button" class="icon-text-button" type="button" title="新建文档（Ctrl+N）">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round" d="M3.7 2.65h4.35L12.1 6.7v6.15c0 .55-.45 1-1 1H3.7c-.55 0-1-.45-1-1V3.65c0-.55.45-1 1-1Z"/><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round" d="M8 2.75v3.7h3.85M5.15 10.05h5.7"/></svg>
            新建
          </button>
          <button id="open-button" class="icon-text-button" type="button" title="打开文件（Ctrl+O）">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" stroke-linecap="round" d="M2.65 5.5V4.32c0-.4.33-.72.74-.72h1.88c.23 0 .45.1.6.28L7.05 5.5h5.5c.48 0 .87.39.87.87v6.05c0 .55-.44 1-.98 1H3.56c-.54 0-.98-.45-.98-1V5.5h10.84"/></svg>
            打开
          </button>
          <button id="save-button" class="accent-icon-button" type="button" title="保存（Ctrl+S）">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" d="M3.25 3.25h7.15L12.75 5.6v7.15c0 .55-.45 1-1 1h-7.5c-.55 0-1-.45-1-1v-8.5c0-.55.45-1 1-1Z"/><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" d="M5.15 3.35v2.55h5.15V3.35M5.45 9.35h5.1M5.45 11.25h3.15"/></svg>
            保存
          </button>
          <button id="check-update-button" class="icon-button update-button" type="button" title="检查更新" aria-label="检查更新">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" d="M3.3 8a4.7 4.7 0 0 1 7.95-3.35l.75-.75M12.75 2.7v2.85h-2.85M12.7 8a4.7 4.7 0 0 1-7.95 3.35l-.75.75M3.25 13.3V10.45h2.85"/></svg>
          </button>
        </div>
      </header>

      <section id="editor-wrap" aria-label="Markdown 编辑器">
        <div id="editor"></div>
        <textarea id="source-editor" class="hidden" spellcheck="false" aria-label="Markdown 源码"></textarea>
        <div id="table-toolbar" class="table-toolbar hidden" role="toolbar" aria-label="表格工具">
          <div class="table-toolbar-group">
            <button id="table-insert-button" type="button" data-table-action="toggle-insert" title="选择表格大小" aria-label="选择表格大小" aria-haspopup="dialog" aria-expanded="false">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M3.25 2A1.25 1.25 0 0 0 2 3.25v9.5A1.25 1.25 0 0 0 3.25 14h9.5A1.25 1.25 0 0 0 14 12.75v-9.5A1.25 1.25 0 0 0 12.75 2h-9.5ZM3.5 6.5h3v3h-3v-3Zm4.5 0h4.5v3H8v-3Zm-4.5 4.5h3v2.5H3.75a.25.25 0 0 1-.25-.25V11Zm4.5 0h4.5v2.25a.25.25 0 0 1-.25.25H8V11ZM6.5 3.5v1.5h-3V3.75c0-.138.112-.25.25-.25H6.5Zm1.5 0h4.25c.138 0 .25.112.25.25V5H8V3.5Z"/></svg>
            </button>
            <button type="button" data-table-action="align-left" title="当前列居左" aria-label="当前列居左">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M2.25 3.15h11.5v1.2H2.25zm0 4.25h8.2v1.2h-8.2zm0 4.25h11.5v1.2H2.25z"/></svg>
            </button>
            <button type="button" data-table-action="align-center" title="当前列居中" aria-label="当前列居中">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M2.25 3.15h11.5v1.2H2.25zm2.15 4.25h7.2v1.2h-7.2zM2.25 11.65h11.5v1.2H2.25z"/></svg>
            </button>
            <button type="button" data-table-action="align-right" title="当前列居右" aria-label="当前列居右">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M2.25 3.15h11.5v1.2H2.25zm3.3 4.25h8.2v1.2h-8.2zM2.25 11.65h11.5v1.2H2.25z"/></svg>
            </button>
          </div>
          <div class="table-toolbar-group">
            <button id="table-more-button" type="button" data-table-action="toggle-more" title="更多" aria-label="更多" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 3.15a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1Zm0 3.85a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1Zm0 3.85a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1Z"/></svg>
            </button>
            <button type="button" class="is-danger" data-table-action="delete-table" title="删除表格" aria-label="删除表格">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M6.15 2.35h3.7c.22 0 .42.15.48.36l.17.59H13a.7.7 0 0 1 0 1.4h-.4l-.58 6.72A1.7 1.7 0 0 1 10.33 13.3H5.67a1.7 1.7 0 0 1-1.69-1.88L3.4 4.7H3a.7.7 0 0 1 0-1.4h2.5l.17-.59a.5.5 0 0 1 .48-.36Zm.46 1.4-.08.25h2.94l-.08-.25H6.61ZM4.81 4.7l.56 6.54c.04.4.37.66.7.66h4.66c.33 0 .66-.26.7-.66L11.2 4.7H4.81Z"/></svg>
            </button>
          </div>
          <div id="table-insert-menu" class="table-menu table-size-picker hidden" role="dialog" aria-label="选择表格大小">
            <div id="table-size-grid" class="table-size-grid" role="grid" aria-label="表格行列"></div>
            <div class="table-size-label"><span id="table-size-text">1 x 1</span></div>
          </div>
          <div id="table-more-menu" class="table-menu table-menu-right hidden" role="menu" aria-label="更多表格操作">
            <button type="button" role="menuitem" data-table-action="insert-row-above">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" style="margin-right:6px"><path fill="currentColor" d="M8 2.75a.75.75 0 0 1 .75.75v3.75H12.5a.75.75 0 0 1 0 1.5H8.75V12.5a.75.75 0 0 1-1.5 0V8.75H3.5a.75.75 0 0 1 0-1.5h3.75V3.5A.75.75 0 0 1 8 2.75Z"/></svg>
              在上方插入行
            </button>
            <button type="button" role="menuitem" data-table-action="insert-row-below">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" style="margin-right:6px"><path fill="currentColor" d="M8 2.75a.75.75 0 0 1 .75.75v3.75H12.5a.75.75 0 0 1 0 1.5H8.75V12.5a.75.75 0 0 1-1.5 0V8.75H3.5a.75.75 0 0 1 0-1.5h3.75V3.5A.75.75 0 0 1 8 2.75Z"/></svg>
              在下方插入行
            </button>
            <button type="button" role="menuitem" data-table-action="insert-col-left">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" style="margin-right:6px"><path fill="currentColor" d="M8 2.75a.75.75 0 0 1 .75.75v3.75H12.5a.75.75 0 0 1 0 1.5H8.75V12.5a.75.75 0 0 1-1.5 0V8.75H3.5a.75.75 0 0 1 0-1.5h3.75V3.5A.75.75 0 0 1 8 2.75Z"/></svg>
              在左侧插入列
            </button>
            <button type="button" role="menuitem" data-table-action="insert-col-right">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" style="margin-right:6px"><path fill="currentColor" d="M8 2.75a.75.75 0 0 1 .75.75v3.75H12.5a.75.75 0 0 1 0 1.5H8.75V12.5a.75.75 0 0 1-1.5 0V8.75H3.5a.75.75 0 0 1 0-1.5h3.75V3.5A.75.75 0 0 1 8 2.75Z"/></svg>
              在右侧插入列
            </button>
            <button type="button" role="menuitem" data-table-action="delete-row">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" style="margin-right:6px"><path fill="currentColor" d="M11 1.75a.75.75 0 0 1 .75.75v.75h1a.75.75 0 0 1 0 1.5h-1v.75a.75.75 0 0 1-1.5 0v-.75h-1a.75.75 0 0 1 0-1.5h1V2.5A.75.75 0 0 1 11 1.75ZM1.5 5.25A1.75 1.75 0 0 1 3.25 3.5h4a.75.75 0 0 1 0 1.5h-4a.25.25 0 0 0-.25.25v6.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25v-4a.75.75 0 0 1 1.5 0v4A1.75 1.75 0 0 1 12.75 13.5h-9.5A1.75 1.75 0 0 1 1.5 11.75v-6.5ZM5.22 7.97a.75.75 0 0 1 1.06 0L8 9.69l1.72-1.72a.75.75 0 1 1 1.06 1.06L9.06 10.75l1.72 1.72a.75.75 0 1 1-1.06 1.06L8 11.81l-1.72 1.72a.75.75 0 0 1-1.06-1.06l1.72-1.72-1.72-1.72a.75.75 0 0 1 0-1.06Z"/></svg>
              删除当前行
            </button>
            <button type="button" role="menuitem" data-table-action="delete-column">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" style="margin-right:6px"><path fill="currentColor" d="M4.75 1.75a.75.75 0 0 1 .75.75v1h.75a.75.75 0 0 1 0 1.5H5.5v.75a.75.75 0 0 1-1.5 0V5h-.75a.75.75 0 0 1 0-1.5H4V2.5a.75.75 0 0 1 .75-.75ZM1.5 8A1.75 1.75 0 0 1 3.25 6.25v-.5a.75.75 0 0 1 1.5 0v.5h.5a.75.75 0 0 1 0 1.5H4.75v.5a.75.75 0 0 1-1.5 0v-.5H3.25A.25.25 0 0 0 3 7.75v4.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V7.75a.25.25 0 0 0-.25-.25H9.25a.75.75 0 0 1 0-1.5h3.5A1.75 1.75 0 0 1 14.5 7.75v4.5A1.75 1.75 0 0 1 12.75 14h-9.5A1.75 1.75 0 0 1 1.5 12.25V8Zm5.72.22a.75.75 0 0 1 1.06 0L10 9.94l1.72-1.72a.75.75 0 1 1 1.06 1.06L11.06 11l1.72 1.72a.75.75 0 1 1-1.06 1.06L10 12.06l-1.72 1.72a.75.75 0 0 1-1.06-1.06L8.94 11 7.22 9.28a.75.75 0 0 1 0-1.06Z"/></svg>
              删除当前列
            </button>
          </div>
        </div>
        <div id="language-popup" class="language-popup hidden" role="listbox" aria-label="选择代码语言">
          <div class="language-popup-header">
            <span>代码语言</span>
            <kbd>Enter</kbd>
          </div>
          <input id="language-query-input" class="language-query-input" type="text" placeholder="输入语言，例如 java" autocomplete="off" />
          <div id="language-list" class="language-list"></div>
        </div>
        <div id="find-bar" class="find-bar hidden" role="search" aria-label="查找和替换">
          <div class="find-row">
            <input id="find-input" class="find-input" type="text" placeholder="查找" autocomplete="off" spellcheck="false" />
            <span id="find-count" class="find-count" aria-live="polite"></span>
            <button id="find-case" type="button" title="区分大小写" aria-label="区分大小写" aria-pressed="false">Aa</button>
            <button id="find-prev" type="button" title="上一个（Shift+Enter）" aria-label="上一个">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 3.2 3.4 7.8a.7.7 0 1 0 1 1L7.3 5.9V12.5a.7.7 0 1 0 1.4 0V5.9l2.9 2.9a.7.7 0 1 0 1-1z"/></svg>
            </button>
            <button id="find-next" type="button" title="下一个（Enter）" aria-label="下一个">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 12.8 3.4 8.2a.7.7 0 1 1 1-1l2.9 2.9V3.5a.7.7 0 1 1 1.4 0v6.6l2.9-2.9a.7.7 0 1 1 1 1z"/></svg>
            </button>
            <button id="find-toggle-replace" type="button" title="显示替换" aria-label="显示替换" aria-expanded="false">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M3.2 5.2 8 10l4.8-4.8-.9-.9L8 8.2 4.1 4.3z"/></svg>
            </button>
            <button id="find-close" type="button" title="关闭（Esc）" aria-label="关闭查找">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="m4.2 3.2 3.8 3.8 3.8-3.8.9.9L8.9 8l3.8 3.8-.9.9L8 8.9l-3.8 3.8-.9-.9L7.1 8 3.3 4.2z"/></svg>
            </button>
          </div>
          <div id="replace-row" class="find-row replace-row hidden">
            <input id="replace-input" class="find-input" type="text" placeholder="替换为" autocomplete="off" spellcheck="false" />
            <button id="replace-one" class="find-text-button" type="button" title="替换当前（Ctrl+Alt+Enter）">
              <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M3.75 3.5a.25.25 0 0 0-.25.25v2.19l1.22-1.22a.75.75 0 0 1 1.06 1.06L4.06 7.53a.75.75 0 0 1-1.06 0L1.22 5.78a.75.75 0 0 1 1.06-1.06l.72.72V3.75A1.75 1.75 0 0 1 4.75 2h2.5a.75.75 0 0 1 0 1.5h-2.5Zm9.5 9a.25.25 0 0 1-.25.25h-2.5a.75.75 0 0 0 0 1.5h2.5A1.75 1.75 0 0 0 14.75 12.5v-2.19l.72.72a.75.75 0 1 0 1.06-1.06l-1.78-1.78a.75.75 0 0 0-1.06 0l-1.78 1.78a.75.75 0 1 0 1.06 1.06l1.22-1.22v2.19Z"/></svg>
              替换

            <button id="replace-all" class="find-text-button" type="button" title="全部替换">
              <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M3.75 3.5a.25.25 0 0 0-.25.25v2.19l1.22-1.22a.75.75 0 0 1 1.06 1.06L4.06 7.53a.75.75 0 0 1-1.06 0L1.22 5.78a.75.75 0 0 1 1.06-1.06l.72.72V3.75A1.75 1.75 0 0 1 4.75 2h2.5a.75.75 0 0 1 0 1.5h-2.5Zm9.5 9a.25.25 0 0 1-.25.25h-2.5a.75.75 0 0 0 0 1.5h2.5A1.75 1.75 0 0 0 14.75 12.5v-2.19l.72.72a.75.75 0 1 0 1.06-1.06l-1.78-1.78a.75.75 0 0 0-1.06 0l-1.78 1.78a.75.75 0 1 0 1.06 1.06l1.22-1.22v2.19Z"/></svg>
              全部替换
            </button>
          </div>
        </div>
        <div id="update-panel" class="update-panel hidden" role="dialog" aria-labelledby="update-title" aria-describedby="update-lead">
          <div class="update-head">
            <img src="../../assets/logo-mark.png" alt="" width="18" height="18" />
            <h2 id="update-title">检查更新</h2>
            <button id="update-close" class="update-icon-btn" type="button" title="关闭" aria-label="关闭">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="m4.2 3.2 3.8 3.8 3.8-3.8.9.9L8.9 8l3.8 3.8-.9.9L8 8.9l-3.8 3.8-.9-.9L7.1 8 3.3 4.2z"/></svg>
            </button>
          </div>
          <div class="update-body">
            <p id="update-lead" class="update-lead" aria-live="polite">正在查看新版本</p>
            <p id="update-versions" class="update-versions hidden">
              <span id="update-current"></span>
              <span class="update-arrow" aria-hidden="true">→</span>
              <span id="update-latest"></span>
            </p>
            <p id="update-meta" class="update-meta hidden"></p>
            <ul id="update-notes" class="update-notes hidden"></ul>
            <p id="update-error" class="update-error hidden"></p>
          </div>
          <div id="update-actions" class="update-actions">
            <button id="update-download" class="update-download hidden" type="button">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M7.47 10.78a.75.75 0 0 0 1.06 0l3.5-3.5a.75.75 0 0 0-1.06-1.06L8.75 8.44V1.75a.75.75 0 0 0-1.5 0v6.69L5.03 6.22a.75.75 0 0 0-1.06 1.06l3.5 3.5ZM2.75 13.25a.75.75 0 0 0 0 1.5h10.5a.75.75 0 0 0 0-1.5H2.75Z"/></svg>
              下载绿色版
            </button>
            <button id="update-setup" class="text-button hidden" type="button">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M7.47 10.78a.75.75 0 0 0 1.06 0l3.5-3.5a.75.75 0 0 0-1.06-1.06L8.75 8.44V1.75a.75.75 0 0 0-1.5 0v6.69L5.03 6.22a.75.75 0 0 0-1.06 1.06l3.5 3.5ZM2.75 13.25a.75.75 0 0 0 0 1.5h10.5a.75.75 0 0 0 0-1.5H2.75Z"/></svg>
              下载安装版
            </button>
            <button id="update-retry" class="text-button hidden" type="button">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M3.2 8a4.8 4.8 0 0 1 8.14-3.4l.76-.76A.7.7 0 0 1 13.3 4.3v2.5a.6.6 0 0 1-.6.6H10.2a.7.7 0 0 1-.5-1.2l.7-.7A3.4 3.4 0 1 0 11.4 9.7a.7.7 0 1 1 1.24.64A4.8 4.8 0 0 1 3.2 8Z"/></svg>
              再试一次
            </button>
            <button id="update-later" class="text-button hidden" type="button">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm0 1.5a5.5 5.5 0 1 1 0 11A5.5 5.5 0 0 1 8 2.5ZM8.75 5a.75.75 0 0 0-1.5 0v3.5a.75.75 0 0 0 .22.53l2 2a.75.75 0 1 0 1.06-1.06l-1.78-1.78V5Z"/></svg>
              稍后
            </button>
            <button id="update-ok" class="text-button hidden" type="button">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M13.78 3.47a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 0 1-1.06 0l-3.5-3.5a.75.75 0 1 1 1.06-1.06L6 10.69l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>
              确定
            </button>
            <button id="update-release" class="update-link hidden" type="button">
              <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M10.604 1h4.146a.25.25 0 0 1 .25.25v4.146a.25.25 0 0 1-.427.177L13.03 4.03 9.28 7.78a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l3.75-3.75-1.543-1.543A.25.25 0 0 1 10.604 1ZM3.75 2A1.75 1.75 0 0 0 2 3.75v8.5c0 .966.784 1.75 1.75 1.75h8.5A1.75 1.75 0 0 0 14 12.25v-3.5a.75.75 0 0 0-1.5 0v3.5a.25.25 0 0 1-.25.25h-8.5a.25.25 0 0 1-.25-.25v-8.5a.25.25 0 0 1 .25-.25h3.5a.75.75 0 0 0 0-1.5h-3.5Z"/></svg>
              GitHub Release
            </button>
          </div>
        </div>
        <div id="quick-open" class="quick-open hidden" role="dialog" aria-label="快速打开">
          <input id="quick-open-input" class="quick-open-input" type="text" placeholder="打开工作区里的文档" autocomplete="off" spellcheck="false" />
          <div id="quick-open-list" class="quick-open-list" role="listbox" aria-label="匹配的文档"></div>
        </div>
        <div id="format-menu" class="format-menu hidden" role="menu" aria-label="文字格式">
          <div class="format-menu-row">
            <button type="button" data-format="cut" title="剪切" aria-label="剪切">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" d="M5.15 6.7 12.4 12.6M5.15 9.3 12.4 3.4"/><circle cx="4.15" cy="4.35" r="1.7" fill="none" stroke="currentColor" stroke-width="1.35"/><circle cx="4.15" cy="11.65" r="1.7" fill="none" stroke="currentColor" stroke-width="1.35"/></svg>

            <button type="button" data-format="copy" title="复制" aria-label="复制">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" d="M5.4 4.4h7.1v8.3H5.4z"/><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" d="M3.5 3.4V2.7h7.1"/></svg>

            <span class="format-menu-gap"></span>
            <button type="button" class="format-letter" data-format="bold" title="加粗" aria-label="加粗"><span>B</span></button>
            <button type="button" class="format-letter format-italic" data-format="italic" title="斜体" aria-label="斜体"><span>I</span></button>
            <button type="button" class="format-letter format-strike" data-format="strike" title="删除线" aria-label="删除线"><span>S</span></button>
            <button type="button" data-format="code" title="行内代码" aria-label="行内代码">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" d="M5.55 4.15 2.7 8l2.85 3.85M10.45 4.15 13.3 8l-2.85 3.85"/></svg>

            </button>
          </div>
          <div class="format-menu-row">
            <button type="button" class="format-letter" data-format="h1" title="一级标题" aria-label="一级标题"><span>H1</span></button>
            <button type="button" class="format-letter" data-format="h2" title="二级标题" aria-label="二级标题"><span>H2</span></button>
            <button type="button" class="format-letter" data-format="h3" title="三级标题" aria-label="三级标题"><span>H3</span></button>
            <button type="button" data-format="quote" title="引用" aria-label="引用">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" d="M3.2 3.6h3.3v5.1H4.4L3.2 11.4V3.6Zm6.3 0h3.3v5.1h-2.1L9.5 11.4V3.6Z"/></svg>
            </button>
            <span class="format-menu-gap"></span>
            <button type="button" data-format="ul" title="无序列表" aria-label="无序列表">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M3.2 4.15h1.3v1.3H3.2zm0 3.2h1.3v1.3H3.2zm0 3.2h1.3v1.3H3.2z"/><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" d="M6.5 4.8h6.3M6.5 8h6.3M6.5 11.2h6.3"/></svg>
            </button>
            <button type="button" data-format="ol" title="有序列表" aria-label="有序列表">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M3.05 3.55h1.7v.85H3.85v.15h.7v.75h-.7v.2h.95v.85H3.05zm0 4.55h1.7v.8H3.85V9.1h.9v.8h-1.7zm0 3.15h1.7v.8H3.85v.2h.9v.8H3.05z"/><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" d="M6.6 4.8h6.2M6.6 8h6.2M6.6 11.2h6.2"/></svg>
            </button>
            <button type="button" data-format="task" title="任务列表" aria-label="任务列表">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" d="M3.15 3.35h3.4v3.4h-3.4z"/><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" d="m3.55 5.05 1.05 1.05 1.7-1.85M8.2 4.8h4.7M3.2 10.9h9.7"/></svg>

            <button type="button" data-format="clear" title="清除格式" aria-label="清除格式">
              <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" d="M4.2 12.6h7.6M6.1 12.4 8.7 3.5h1.15L7.2 12.4M3.4 7.6h9.3"/></svg>
            </button>
          </div>
        </div>
        <div id="drop-mask" class="drop-mask" aria-hidden="true">放到这里打开文档或插入图片</div>
      </section>

      <footer id="statusbar">
        <div class="status-group">
          <button id="status-sidebar-toggle" type="button" title="显示或隐藏目录栏">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" d="M2.8 4.25h10.4M2.8 8h10.4M2.8 11.75h10.4"/></svg>

        <div class="status-group status-right">

            <svg class="mode-source" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" d="M5.55 4.15 2.7 8l2.85 3.85M10.45 4.15 13.3 8l-2.85 3.85"/></svg>
          </button>
          <span id="encoding-label">UTF-8</span>
          <span id="counts">0 字 · 0 字符</span>
        </div>
      </footer>
    </main>
  </div>

      </div>
    </div>
